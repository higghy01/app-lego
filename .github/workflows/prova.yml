name: Prova fronti (temporanea)
on:
  push:
    branches: [claude/project-thread-2a3gmn]
    paths: [prova/*.py, .github/workflows/prova.yml]
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet pillow numpy scipy opencv-python-headless
          for f in prova/*.py; do python "$f"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add prova/out
          git commit -m "prova: risultati" && git push
