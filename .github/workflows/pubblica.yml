name: Aggiorna catalogo e pubblica

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"   # ogni lunedi' mattina
  workflow_dispatch:      # pulsante "Run workflow" per aggiornare a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepara il sito
        run: |
          mkdir -p _site
          cp -r app/. _site/
          python scripts/build_catalog.py _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
