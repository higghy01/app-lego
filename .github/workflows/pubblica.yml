name: Aggiorna catalogo e pubblica

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"   # ogni mattina
  workflow_dispatch:      # pulsante "Run workflow" per aggiornare a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Brickset limita le chiamate al giorno: si scarica un po' ogni giorno.
      # Le foto in piu' (getAdditionalImages) non contano nel limite: 1500 set al giorno, i piu' nuovi prima, solo dal 2000 in poi.
      # Se non va (chiave mancante o errata) il sito si pubblica lo stesso.
      - name: Aggiorna dati Brickset
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
        run: |
          # Anche se Brickset si ferma (es. limite giornaliero), quanto scaricato si salva.
          python scripts/fetch_brickset.py --max-calls 60 --max-images 1500 || echo "::warning title=Brickset::aggiornamento incompleto, riprovo domani"
          if [ -n "$(git status --porcelain data-src)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data-src
            git commit -m "Aggiorna dati Brickset"
            git push
          fi
      - name: Prepara il sito
        run: |
          mkdir -p _site
          cp -r app/. _site/
          python scripts/build_catalog.py _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
