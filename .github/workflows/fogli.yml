name: Fogli foto (temporaneo)
on:
  push:
    branches: [claude/project-thread-qt19nx]
    paths: [tmp-fogli/crop.json, tmp-fogli/lista.json, tmp-fogli/fogli_sheet.py, tmp-fogli/fogli_crop.py, tmp-fogli/schermate.js, .github/workflows/fogli.yml]
permissions:
  contents: write
jobs:
  fogli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet pillow numpy scipy && python tmp-fogli/fogli_crop.py
      - run: mkdir -p _site && cp -r app/. _site/ && python scripts/build_catalog.py _site/data
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          node tmp-fogli/schermate.js _site tmp-fogli/out
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tmp-fogli/out && git commit -m "fogli" && git pull --rebase && git push
