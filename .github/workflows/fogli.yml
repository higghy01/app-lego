name: Fogli foto (temporaneo)
on:
  push:
    branches: [claude/project-thread-qt19nx]
    paths: [tmp-fogli/lista.json, tmp-fogli/fogli.py, .github/workflows/fogli.yml]
permissions:
  contents: write
jobs:
  fogli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet pillow && python tmp-fogli/fogli.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tmp-fogli/out && git commit -m "fogli" && git push
