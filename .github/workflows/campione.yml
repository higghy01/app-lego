name: Verifica foto (temporaneo)
on:
  push:
    branches: [claude/project-thread-vca5et]
    paths: [campione/lista.json]
permissions:
  contents: write
jobs:
  fogli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow && python campione/controlla.py campione/lista.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add campione && git commit -m "Fogli verifica foto" && git push
