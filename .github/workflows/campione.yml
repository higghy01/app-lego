name: Verifica foto (temporaneo)
on:
  push:
    branches: [claude/project-thread-3qjckp]
    paths: [campione/prova.json, campione/prova_fronti.py, scripts/fronti_scatola.py]
permissions:
  contents: write
jobs:
  fogli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow numpy scipy && python campione/prova_fronti.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add campione && git commit -m "Fogli verifica foto" && git push
